# Portrait-locked app, WebView inside a Modal. Rotating during fullscreen must
# not lay out the React root in landscape or unmount either WebView.
appId: io.github.wodin.rnwvrotation
---
- setOrientation: PORTRAIT
- launchApp:
    clearState: true
- assertVisible: 'mounts: 1'
- tapOn: 'Open Modal'
- tapOn: 'Enter fullscreen in Modal'
# Android's one-time immersive mode hint.
- tapOn:
    text: 'Got it'
    optional: true
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
# Not there if the WebView was destroyed.
- tapOn:
    text: 'Exit fullscreen in Modal'
    optional: true
- setOrientation: PORTRAIT
- assertVisible: 'Enter fullscreen in Modal'
- back
- copyTextFrom: 'mounts: \d+'
- evalScript: ${output.mounts = maestro.copiedText}
- copyTextFrom: 'unmounts: \d+'
- evalScript: ${output.unmounts = maestro.copiedText}
- copyTextFrom: 'layouts: .*'
- evalScript: ${output.layouts = maestro.copiedText}
- runScript:
    file: check.js
    env:
      # The Modal closing unmounts its WebView.
      WANT: 'mounts: 2, unmounts: 1, layouts: \d+x\d+'
