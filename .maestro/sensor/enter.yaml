# First half of a run where the script rotates the device through its
# accelerometer. setOrientation would turn auto-rotate off, so it is not used.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- assertVisible: 'mounts: 1'
- tapOn: 'Enter fullscreen'
# Android's one-time immersive mode hint.
- tapOn:
    text: 'Got it'
    optional: true
